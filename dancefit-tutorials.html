<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D Pro Tutorials — DanceFit Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #170F1E;
    --bg-soft: #1F1527;
    --card: #241931;
    --line: #392A46;
    --magenta: #EC1E86;
    --orange: #FF8A3D;
    --purple: #8B5CF6;
    --text: #F4EEFA;
    --text-dim: #A99CBB;
    --text-faint: #6E6180;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--magenta); color:#fff; }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:56px 24px 40px;
    overflow:hidden;
    background:
      radial-gradient(120% 140% at 15% -10%, rgba(236,30,134,.35), transparent 55%),
      radial-gradient(120% 140% at 100% 0%, rgba(255,138,61,.25), transparent 50%),
      var(--bg);
    border-bottom:1px solid var(--line);
  }
  .eq{
    display:flex;
    align-items:flex-end;
    gap:5px;
    height:26px;
    margin-bottom:18px;
  }
  .eq span{
    width:5px;
    border-radius:2px;
    background:linear-gradient(180deg, var(--magenta), var(--orange));
    animation: bounce 1.1s ease-in-out infinite;
  }
  .eq span:nth-child(1){ height:40%; animation-delay:-0.9s; }
  .eq span:nth-child(2){ height:100%; animation-delay:-0.6s; }
  .eq span:nth-child(3){ height:65%; animation-delay:-0.3s; }
  .eq span:nth-child(4){ height:85%; animation-delay:-1.1s; }
  .eq span:nth-child(5){ height:50%; animation-delay:-0.45s; }
  @keyframes bounce{ 0%,100%{ transform:scaleY(.35); } 50%{ transform:scaleY(1); } }
  @media (prefers-reduced-motion: reduce){ .eq span{ animation:none; } }

  .brand{
    font-size:13px;
    letter-spacing:.14em;
    color:var(--text-dim);
    margin:0 0 6px;
  }
  .brand b{ color:var(--orange); font-weight:600; }

  h1{
    font-family:'Bebas Neue', sans-serif;
    font-weight:400;
    font-size:clamp(44px, 10vw, 84px);
    line-height:.92;
    letter-spacing:.01em;
    margin:0;
    background:linear-gradient(90deg, #fff 0%, #fff 55%, var(--orange) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero p{
    max-width:520px;
    margin:14px 0 0;
    color:var(--text-dim);
    font-size:16px;
    line-height:1.55;
  }

  .stats{
    display:flex;
    gap:28px;
    margin-top:28px;
    flex-wrap:wrap;
  }
  .stat b{
    display:block;
    font-family:'Bebas Neue', sans-serif;
    font-size:30px;
    color:var(--text);
    letter-spacing:.02em;
  }
  .stat span{
    font-size:12px;
    color:var(--text-faint);
    letter-spacing:.04em;
  }

  /* ---------- CONTROLS ---------- */
  .controls{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(23,15,30,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 24px;
  }
  .controls-inner{ max-width:760px; margin:0 auto; }

  .search{
    position:relative;
    display:flex;
    align-items:center;
  }
  .search svg{
    position:absolute;
    left:14px;
    width:16px; height:16px;
    stroke:var(--text-faint);
  }
  .search input{
    width:100%;
    padding:12px 14px 12px 40px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--bg-soft);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    outline:none;
    transition:border-color .15s ease;
  }
  .search input::placeholder{ color:var(--text-faint); }
  .search input:focus{ border-color:var(--magenta); }

  .chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-top:12px;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:none;
    padding:6px 13px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--bg-soft);
    color:var(--text-dim);
    font-size:13px;
    font-weight:500;
    white-space:nowrap;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip:hover{ border-color:var(--purple); color:var(--text); }

  .no-results{
    display:none;
    text-align:center;
    color:var(--text-faint);
    padding:60px 20px;
    font-size:14px;
  }

  /* ---------- LIST ---------- */
  main{
    max-width:760px;
    margin:0 auto;
    padding:36px 24px 80px;
  }

  .month-group{ margin-bottom:34px; }
  .month-group.hide{ display:none; }

  .month-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:12px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .month-head h2{
    font-family:'Bebas Neue', sans-serif;
    font-weight:400;
    font-size:26px;
    letter-spacing:.02em;
    margin:0;
    color:var(--text);
  }
  .month-head .count{
    font-size:12px;
    color:var(--text-faint);
  }

  .track{
    display:grid;
    grid-template-columns:34px 1fr;
    align-items:center;
    gap:14px;
    padding:11px 10px;
    border-radius:10px;
    transition:background .12s ease;
  }
  .track.hide{ display:none; }
  .track:hover{ background:var(--card); }

  .track .num{
    font-family:'Bebas Neue', sans-serif;
    font-size:17px;
    color:var(--text-faint);
    text-align:right;
  }
  .track:hover .num{ color:var(--orange); }

  .track .name{
    font-size:15.5px;
    font-weight:500;
    color:var(--text);
    letter-spacing:.01em;
  }
  .track .name mark{
    background:transparent;
    color:var(--orange);
    font-weight:700;
  }

  footer{
    text-align:center;
    padding:30px 24px 50px;
    color:var(--text-faint);
    font-size:12.5px;
    border-top:1px solid var(--line);
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="eq"><span></span><span></span><span></span><span></span><span></span></div>
    <p class="brand"><b>DANCEFIT STUDIO</b> — D Pro</p>
    <h1>TUTORIALS</h1>
    <p>Every choreography we've taught, month by month. Search a song or jump to a month to find the class you're looking for.</p>
    <div class="stats">
      <div class="stat"><b id="statSongs">0</b><span>TUTORIALS</span></div>
      <div class="stat"><b id="statMonths">0</b><span>MONTHS COVERED</span></div>
      <div class="stat"><b>Mar '25 – Aug '26</b><span>TIMESPAN</span></div>
    </div>
  </div>

  <div class="controls">
    <div class="controls-inner">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Search a song…" autocomplete="off">
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <main id="main">
    <div class="no-results" id="noResults">No tutorials match that search.</div>
  </main>

  <footer>DanceFit Studio App · D Pro Tutorial Log</footer>

<script>
const DATA = [
  { month: "2026 - August", songs: ["Kalyani","Govind Bolo","Piya Ghar Aavenge","Tabahi"] },
  { month: "2026 - July", songs: ["Dooron Dooron","Maskara","Jhoom Barabar Jhoom","Rehja Rehja","Dholkichya Talavar"] },
  { month: "2026 - June", songs: ["Main Aur Tu","Vachindamma","Jaiye Sajana","No Batidao","Shiv Tandav"] },
  { month: "2026 - May", songs: ["Bol Na Halke Halke","Mehbooba Mehbooba 2.0","Aachhri","Billo Rani","Rang De Lal"] },
  { month: "2026 - April", songs: ["Beat It","Case","Oud","Rasputin","Ghar More Pardesiya","Softly","Sheesha","Sheila Ki Jawani"] },
  { month: "2026 - March", songs: ["Panwadi","Naal Nachna","Ishq Jalakar","Dopamine","Bam Lahri","Sirra","Jallah Wallah"] },
  { month: "2026 - February", songs: ["Ku Lo Sa","Dem Beats","Gila X In My Bed","Lallati Bhandar","Ladka Tera Diwana","Taal","Dakla"] },
  { month: "2026 - January", songs: ["Guli Mata","Janiye X Harleys In Hawai","Chanel","Zindagi Mera Dance","Shararat","For A Reason"] },
  { month: "2025 - December", songs: ["Banke Tera Jogi","Aye Udi Udi","Sholon Si","Cutie Pie"] },
  { month: "2025 - November", songs: ["Aavan Jaavan","Touch Me","Chaiya Chaiya"] },
  { month: "2025 - October", songs: ["Saiyaara Reprise","Kajra Re","Aga Bai"] },
  { month: "2025 - September", songs: ["Oh Mama Tetema","Garba Week - TALI","Garba Week - DODHIYA","Garba Week - HINCH"] },
  { month: "2025 - August", songs: ["Tu Jaane Na","Malang Sajna","Badri Ki Dulhaniyan"] },
  { month: "2025 - July", songs: ["Dum Dum Mast Hai","Besos","Pyaar Hota Kai Baar","Ek Do Teen"] },
  { month: "2025 - June", songs: ["Bhasad Macha","Is It","Rukhi Sukhi Roti"] },
  { month: "2025 - May", songs: ["Y Que Foy","You Are My Sonia","Pritam Pyaare"] },
  { month: "2025 - April", songs: ["Bukhar Dance","Beautiful Liar","It's Magic","Main Parwana"] },
  { month: "2025 - March", songs: ["Aye Hip Hopper","Kahani Suno"] }
];

const main = document.getElementById('main');
const noResults = document.getElementById('noResults');
const chips = document.getElementById('chips');
const searchInput = document.getElementById('searchInput');

const totalSongs = DATA.reduce((n,g)=>n+g.songs.length,0);
document.getElementById('statSongs').textContent = totalSongs;
document.getElementById('statMonths').textContent = DATA.length;

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

DATA.forEach(group=>{
  const id = slug(group.month);

  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.type = 'button';
  chip.textContent = group.month.replace('20','\u201920').replace(' - ', ' ');
  chip.addEventListener('click', ()=>{
    document.getElementById(id).scrollIntoView({behavior:'smooth', block:'start'});
  });
  chips.appendChild(chip);

  const section = document.createElement('section');
  section.className = 'month-group';
  section.id = id;
  section.dataset.month = group.month.toLowerCase();

  const head = document.createElement('div');
  head.className = 'month-head';
  head.innerHTML = `<h2>${group.month}</h2><span class="count">${group.songs.length} tutorial${group.songs.length===1?'':'s'}</span>`;
  section.appendChild(head);

  group.songs.forEach((song, i)=>{
    const track = document.createElement('div');
    track.className = 'track';
    track.dataset.song = song.toLowerCase();
    track.innerHTML = `<div class="num">${i+1}</div><div class="name">${song}</div>`;
    section.appendChild(track);
  });

  main.appendChild(section);
});

function highlight(text, term){
  if(!term) return text;
  const idx = text.toLowerCase().indexOf(term);
  if(idx === -1) return text;
  return text.slice(0,idx) + '<mark>' + text.slice(idx, idx+term.length) + '</mark>' + text.slice(idx+term.length);
}

searchInput.addEventListener('input', ()=>{
  const term = searchInput.value.trim().toLowerCase();
  let anyVisible = false;

  document.querySelectorAll('.month-group').forEach(group=>{
    let groupHasVisible = false;
    const tracks = group.querySelectorAll('.track');
    tracks.forEach(track=>{
      const song = track.dataset.song;
      const match = !term || song.includes(term);
      track.classList.toggle('hide', !match);
      const nameEl = track.querySelector('.name');
      nameEl.innerHTML = highlight(nameEl.textContent, term);
      if(match) groupHasVisible = true;
    });
    group.classList.toggle('hide', !groupHasVisible);
    if(groupHasVisible) anyVisible = true;
  });

  noResults.style.display = anyVisible ? 'none' : 'block';
});
</script>
</body>
</html>
